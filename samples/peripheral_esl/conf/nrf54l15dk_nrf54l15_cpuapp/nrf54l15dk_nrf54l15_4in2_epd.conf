CONFIG_LOG_BACKEND_RTT=n

CONFIG_BT_ESL_LED_INDICATION=y

CONFIG_ESL_POWER_PROFILE=y

CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_ESL_SHELL=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
