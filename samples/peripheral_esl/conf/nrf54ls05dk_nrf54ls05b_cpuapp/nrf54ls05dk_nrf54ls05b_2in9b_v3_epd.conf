CONFIG_BT_ESL_SENSOR_MAX=1
CONFIG_ESL_DISPLAY_WIDTH=128
CONFIG_ESL_DISPLAY_HEIGHT=296
CONFIG_BT_ESL_IMAGE_MAX=3
