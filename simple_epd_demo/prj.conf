# Simple E-Paper Display Demo Configuration

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# SPI Driver
CONFIG_SPI=y

# GPIO Driver
CONFIG_GPIO=y

# Paint Library Configuration
CONFIG_PAINT_COLORS=3

# Main stack size (increase for buffers and painting)
CONFIG_MAIN_STACK_SIZE=4096

# Heap memory pool
CONFIG_HEAP_MEM_POOL_SIZE=8192
